@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1729; --paper:#18233b; --ink:#f1e9d6; --ink-soft:#b3bccf; --line:#2c3a5a;
  --accent:#e0a54a; --accent-ink:#ecc07a; --accent-tint:#3a2f1c; --terra:#e08a68; --terra-tint:#3b241c;
  --ok:#6cc497; --ok-tint:#17342a;
  --rail:#0a1120; --rail-fg:#f1e9d6; --rail-soft:#93a0bd; --rail-line:#24314f; --rail-hover:#17233d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1729; --paper:#18233b; --ink:#f1e9d6; --ink-soft:#b3bccf; --line:#2c3a5a;
  --accent:#e0a54a; --accent-ink:#ecc07a; --accent-tint:#3a2f1c; --terra:#e08a68; --terra-tint:#3b241c;
  --ok:#6cc497; --ok-tint:#17342a;
  --rail:#0a1120; --rail-fg:#f1e9d6; --rail-soft:#93a0bd; --rail-line:#24314f; --rail-hover:#17233d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
kbd{font:600 .92em var(--body);background:var(--accent-tint);color:var(--ink);padding:.05em .4em;border-radius:4px;white-space:nowrap}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;
  max-height:100vh;overflow-y:auto;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  display:flex;flex-direction:column;gap:22px;min-height:100vh}
.brand{display:flex;flex-direction:row;align-items:center;gap:11px;text-decoration:none;padding:0 8px}
.lg{background:var(--logo) center/contain no-repeat;flex:none;display:block}
.brand .lg{width:46px;height:43px}
.brand .bt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-soft)}
.brand strong{font:700 1.3rem/1.18 var(--display);text-wrap:balance}
.overall{padding:0 8px;display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--rail-soft)}
.bar{height:6px;border-radius:3px;background:var(--rail-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav .ph{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-soft);padding:14px 8px 4px}
.rail nav a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:6px;text-decoration:none;font-size:.95rem;line-height:1.3}
.rail nav a:hover{background:var(--rail-hover)}
.rail nav a[aria-current="page"]{background:var(--rail-hover);box-shadow:inset 3px 0 0 var(--accent)}
.rail nav a .no{font:700 .95rem var(--display);color:var(--accent)}
.rail nav a .ct{font-size:.75rem;color:var(--rail-soft);font-variant-numeric:tabular-nums}
.rail nav a.done .ct{color:var(--ok)}
.rail .foot{margin-top:auto;padding:0 8px;font-size:.78rem;color:var(--rail-soft);display:flex;flex-direction:column;gap:10px}
.rail .menu-btn{display:none}

main{padding-block:44px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.lead{font-size:1.15rem;color:var(--ink-soft);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);background:transparent;color:var(--ink)}
.btn.small{font-size:.8rem;padding:6px 10px;border-radius:6px}
.rail .btn.ghost{color:var(--rail-fg);border-color:var(--rail-line)}

/* home */
.hero{display:flex;flex-direction:column;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:30px}
.hero .lg{width:84px;height:78px;margin-bottom:-2px}
.hero h1{font-size:clamp(2.1rem,5.5vw,3.3rem);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent-ink)}
.hero .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem;color:var(--ink-soft);list-style:none;margin:0;padding:0}
.facts b{color:var(--ink)}
.phase{display:flex;flex-direction:column;gap:12px}
.phase h2{font-size:1.2rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase h2 span{font:700 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-content:start}
.card:hover{border-color:var(--accent)}
.card .no{font:700 2.3rem/1 var(--display);color:var(--accent);grid-row:span 2}
.card h3{font-size:1.08rem}
.card p{font-size:.9rem;color:var(--ink-soft);line-height:1.4}
.card .st{grid-column:1/-1;font-size:.78rem;color:var(--ink-soft);margin-top:8px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.card.done .st b{color:var(--ok)}

/* module */
.mhead{display:flex;flex-direction:column;gap:12px}
.mhead h1{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--ink-soft);align-items:center}
.pill{background:var(--ok-tint);color:var(--ok);font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:99px}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:1.15rem;padding-bottom:6px;border-bottom:1px solid var(--line)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:grid;grid-template-columns:34px 26px minmax(0,1fr);gap:8px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
ol.steps .n{font:700 1.05rem/1.55 var(--display);color:var(--accent-ink);font-variant-numeric:tabular-nums}
ol.steps input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--ok);cursor:pointer}
ol.steps label{cursor:pointer}
ol.steps li.on{background:transparent}
ol.steps li.on label{color:var(--ink-soft)}
.box{border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:1.05rem}
.box ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.box.eg{background:var(--paper);border:1px dashed var(--accent)}
.box.tip{background:var(--accent-tint)}
.box.no{background:var(--terra-tint)}
.box.no h2{color:var(--terra)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.tree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;line-height:1.7;margin:0;white-space:pre-wrap}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px}
.note{font-size:.82rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:6px}

/* illustrated screens */
.mocks{display:flex;flex-wrap:wrap;gap:14px}
.mcap{font-size:.8rem;color:var(--ink-soft)}
.scr{flex:1 1 230px;min-width:0;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden;font-size:.8rem;line-height:1.35}
.scr-bar{display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--line);font-weight:600;color:var(--ink-soft)}
.scr-bar i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);opacity:.45}
.scr-bar span{margin-left:6px}
.scr-body{padding:16px 16px 14px;display:flex;flex-direction:column;gap:13px;align-items:stretch}
.mr{display:flex;flex-wrap:wrap;gap:13px;align-items:center}
.mb{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:4px 10px;background:var(--bg);font-weight:600;position:relative}
.mb.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hot{position:relative;outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.mk{position:absolute;top:-11px;right:-10px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--accent);color:var(--bg);font:700 .7rem/19px var(--body);text-align:center;font-style:normal;z-index:1}
.mf{border:1px solid var(--line);border-radius:5px;padding:5px 9px;display:flex;flex-direction:column;position:relative;min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.mf small,.ml{color:var(--ink-soft)}
.mm{border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;gap:7px;padding:9px}
.mm div{padding:2px 6px;position:relative}
.mt{display:flex;flex-wrap:wrap;gap:12px 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mt span{position:relative;padding:2px 4px}
.mt .act{font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.mh{font-weight:700}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--ink-soft)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile,.res,.file,.ev{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--bg);position:relative}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;letter-spacing:.12em}
.banner{background:var(--ink);color:var(--bg);padding:12px;display:flex;flex-direction:column;gap:2px}
.chk,.tog{display:flex;gap:8px;align-items:center;position:relative;padding:2px 4px}
.chk u{width:13px;height:13px;border:1.5px solid var(--ink-soft);border-radius:3px;flex:none;text-decoration:none}
.chk u.y{background:var(--ink);border-color:var(--ink)}
.tog u{width:24px;height:13px;border-radius:7px;background:var(--line);flex:none}
.tog u.y{background:var(--ok)}
.mtab{font-size:.76rem}
.mtab th,.mtab td{padding:5px 6px;position:relative;letter-spacing:0;text-transform:none;font-size:inherit}
.mtab .sel{background:var(--ok-tint);font-weight:700}
.dist{display:flex;height:16px;border-radius:4px;overflow:hidden}
.dist i{display:block}

@media (max-width:860px){
  .app{display:block}
  .rail{position:sticky;z-index:5;min-height:0;max-height:none;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .brand{gap:9px;padding:0}
  .brand .lg{width:32px;height:30px}
  .brand small{display:none}.brand strong{font-size:1.05rem}
  .rail .menu-btn{display:inline-flex}
  .overall,.rail nav,.rail .foot{display:none;flex-basis:100%}
  .rail.open{max-height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;gap:14px;padding-bottom:18px}
  .rail.open .overall,.rail.open nav,.rail.open .foot{display:flex}
  .rail.open .overall{margin-top:12px}
  main{padding-block:26px 48px}
  ol.steps li{grid-template-columns:26px 24px minmax(0,1fr);padding:11px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

{n:1, phase:1, title:"Bina Class Team", short:"Satu Team jenis Class untuk setiap kelas.", time:"10 minit",

S25F_Digital Society SL_Batch 2025-27

{n:4, phase:2, title:"Jadualkan kelas langsung", short:"Sesi dalam talian yang muncul dalam kalendar pelajar.", time:"5 minit",

{n:5, phase:2, title:"Rekod kehadiran", short:"Muat turun laporan kehadiran sesi langsung.", time:"5 minit",

const KEY = "kmbkit.done.v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} };
const stepIds = m => { const ids=[]; let i=0; m.groups.forEach(g=>g.steps.forEach(()=>ids.push(`m${m.n}s${++i}`))); return ids; };
const count = m => { const ids=stepIds(m); return [ids.filter(id=>done[id]).length, ids.length]; };
const total = () => M.reduce((a,m)=>{const [d,t]=count(m);return [a[0]+d,a[1]+t];},[0,0]);
const $ = id => document.getElementById(id);
const li = a => a.map(x=>`<li>${x}</li>`).join("");

function renderRail(route){
  let h = `<a href="#utama" ${route==="utama"?'aria-current="page"':''}><span class="no">◆</span><span>Laman utama</span><span></span></a>`;
  PHASES.forEach(p=>{
    h += `<div class="ph">Fasa ${p.id} · ${p.name}</div>`;
    M.filter(m=>m.phase===p.id).forEach(m=>{
      const [d,t]=count(m);
      h += `<a href="#modul-${m.n}" class="${d===t?'done':''}" ${route==="modul-"+m.n?'aria-current="page"':''}><span class="no">${m.n}</span><span>${m.title}</span><span class="ct">${d===t?'✓':d+'/'+t}</span></a>`;
    });
  });
  h += `<div class="ph">Rujukan</div><a href="#rujukan" ${route==="rujukan"?'aria-current="page"':''}><span class="no">→</span><span>Rujukan pantas</span><span></span></a>`;
  $("railNav").innerHTML = h;
  const [d,t]=total();
  $("overallTxt").textContent = `${d} daripada ${t} langkah selesai`;
  $("overallBar").style.width = (t? d/t*100:0)+"%";
}

function home(){
  const [d,t]=total();
  const next = M.find(m=>{const [a,b]=count(m);return a<b;}) || M[0];
  let h = `<section class="hero">
    <i class="lg" role="img" aria-label="Logo Kolej MARA Banting"></i>
    <p class="eyebrow">Kolej MARA Banting · Unit Digitalisasi PdP</p>
    <h1>KMB LMS Module Kit: <em>Microsoft Teams untuk kelas anda</em></h1>
    <p class="lead">Sembilan modul ringkas untuk pensyarah KMB. Setiap modul membimbing anda melalui satu tugas dalam Microsoft Teams, daripada membina ruang kelas hingga menanda tugasan dengan rubrik.</p>
    <ul class="facts"><li><b>9</b> modul</li><li><b>${t}</b> langkah</li><li><b>${d}</b> sudah selesai</li><li>Tandakan setiap langkah semasa anda mencubanya</li></ul>
    <div class="row"><a class="btn" href="#modul-${next.n}">${d? "Sambung":"Mula"} Modul ${next.n}</a><a class="btn ghost" href="#rujukan">Rujukan pantas</a></div>
  </section>`;
  PHASES.forEach(p=>{
    h += `<section class="phase"><h2><span>Fasa ${p.id}</span>${p.name}</h2><div class="cards">`;
    M.filter(m=>m.phase===p.id).forEach(m=>{
      const [a,b]=count(m);
      h += `<a class="card ${a===b?'done':''}" href="#modul-${m.n}"><span class="no">${m.n}</span><h3>${m.title}</h3><p>${m.short}</p><span class="st"><b>${a===b?'Selesai':a+' / '+b+' langkah'}</b><span>${m.time}</span></span></a>`;
    });
    h += `</div></section>`;
  });
  h += foot();
  return h;
}
function foot(){
  return `<div class="note"><span>Disediakan oleh Unit Digitalisasi Pengajaran dan Pembelajaran, Kolej MARA Banting, sebagai bahan rujukan dalaman.</span><span>Nama butang dikekalkan dalam bahasa Inggeris seperti yang tertera dalam Teams. Paparan dan kedudukan butang boleh berbeza sedikit mengikut versi. Microsoft Teams ialah tanda dagangan Microsoft Corporation. Kit ini tidak dihasilkan atau disahkan oleh Microsoft.</span></div>`;
}
function module(m){
  const [d,t]=count(m); const ph=PHASES.find(p=>p.id===m.phase);
  let i=0;
  let h = `<header class="mhead"><p class="eyebrow">Modul ${m.n} daripada ${M.length} · Fasa ${ph.id}: ${ph.name}</p>
    <h1>${m.title}</h1><p class="lead">${m.goal}</p>
    <div class="mmeta"><span>Anggaran masa: ${m.time}</span><span id="mcount">${d} / ${t} langkah</span>${d===t?'<span class="pill">Modul selesai</span>':''}</div></header>`;
  m.groups.forEach((g,gi)=>{
    const mock = MOCKS[m.n+"-"+(gi+1)];
    h += `<section class="group"><h2>${g.h}</h2>${mock?`<div class="mocks" role="img" aria-label="Ilustrasi paparan Teams untuk langkah dalam bahagian ini">${mock.join("")}</div><p class="mcap">Ilustrasi ringkas yang dilukis untuk kit ini, bukan tangkapan skrin sebenar. Nombor pada ilustrasi merujuk kepada nombor langkah di bawah.</p>`:''}<ol class="steps">`;
    g.steps.forEach(s=>{ i++; const id=`m${m.n}s${i}`;
      h += `<li class="${done[id]?'on':''}"><span class="n">${i}</span><input type="checkbox" id="${id}" ${done[id]?'checked':''} aria-label="Tandakan langkah ${i} selesai"><label for="${id}">${s}</label></li>`; });
    h += `</ol></section>`;
  });
  h += `<section class="box eg"><h2>${m.eg.h}</h2>${m.eg.html}</section>`;
  h += `<div class="pair"><section class="box tip"><h2>Petua</h2><ul>${li(m.tips)}</ul></section><section class="box no"><h2>Elakkan</h2><ul>${li(m.avoid)}</ul></section></div>`;
  const prev=M[m.n-2], nx=M[m.n];
  h += `<nav class="pn" aria-label="Modul sebelum dan seterusnya">${prev?`<a class="btn ghost" href="#modul-${prev.n}">← Modul ${prev.n}: ${prev.title}</a>`:`<a class="btn ghost" href="#utama">← Laman utama</a>`}${nx?`<a class="btn" href="#modul-${nx.n}">Modul ${nx.n}: ${nx.title} →</a>`:`<a class="btn" href="#rujukan">Rujukan pantas →</a>`}</nav>`;
  return h + foot();
}
function ref(){
  return `<header class="mhead"><p class="eyebrow">Rujukan</p><h1>Rujukan pantas</h1><p class="lead">Cari tugas yang anda mahu buat, kemudian ikut laluan klik. Buka modul untuk langkah penuh.</p></header>
  <div class="tw"><table><thead><tr><th>Saya mahu…</th><th>Laluan dalam Teams</th><th>Modul</th></tr></thead><tbody>${
    REF.map(r=>`<tr><td>${r[0]}</td><td><kbd style="white-space:normal">${r[1]}</kbd></td><td><a href="#modul-${r[2]}">Modul ${r[2]}</a></td></tr>`).join("")}</tbody></table></div>
  <section class="box tip"><h2>Aliran kerja yang dicadangkan untuk kelas baharu</h2><ul><li>Minggu pertama: bina Team, susun channel, hantar pengumuman alu-aluan.</li><li>Sepanjang penggal: muat naik bahan ke Classwork mengikut unit dan beri tugasan melalui Assignments.</li><li>Setiap tugasan besar: lampirkan rubrik dan tetapkan Close date.</li><li>Setiap minggu atau dua minggu: hantar satu check-in Reflect.</li></ul></section>` + foot();
}

function route(){
  const r = (location.hash||"#utama").slice(1);
  const mm = /^modul-(\d)$/.exec(r); const m = mm && M[+mm[1]-1];
  const name = m ? r : (r==="rujukan" ? r : "utama");
  $("view").innerHTML = m ? module(m) : (name==="rujukan" ? ref() : home());
  renderRail(name);
  $("rail").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded","false");
  return name;
}
window.addEventListener("hashchange", ()=>{ route(); window.scrollTo(0,0); $("main").focus({preventScroll:true}); });
$("view").addEventListener("change", e=>{
  const t=e.target; if(t.type!=="checkbox") return;
  if(t.checked) done[t.id]=1; else delete done[t.id];
  save();
  t.closest("li").classList.toggle("on", t.checked);
  const r=(location.hash||"").slice(1), m=M[+r.split("-")[1]-1];
  if(m){ const [d,tt]=count(m); const meta=$("mcount"); meta.textContent=`${d} / ${tt} langkah`;
    const pill=meta.parentNode.querySelector(".pill");
    if(d===tt && !pill) meta.insertAdjacentHTML("afterend",'<span class="pill">Modul selesai</span>');
    if(d!==tt && pill) pill.remove(); }
  renderRail(r);
});
$("menuBtn").addEventListener("click", ()=>{ const o=$("rail").classList.toggle("open"); $("menuBtn").setAttribute("aria-expanded", o); });
let armed=null;
$("resetBtn").addEventListener("click", e=>{
  const b=e.currentTarget;
  if(!armed){ b.textContent="Pasti? Klik sekali lagi"; armed=setTimeout(()=>{b.textContent="Set semula kemajuan";armed=null;},4000); return; }
  clearTimeout(armed); armed=null; done={}; save(); b.textContent="Set semula kemajuan"; route();
});
route();
